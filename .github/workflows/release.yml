name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  goreleaser:
    name: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token: write is what lets cosign sign keylessly against
      # Sigstore's Fulcio/Rekor using this job's own short-lived GitHub
      # OIDC token — no signing key stored as a repo secret at all.
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # sboms:/signs: in .goreleaser.yaml shell out to these two tools
      # directly; goreleaser doesn't bundle either.
      - uses: anchore/sbom-action/download-syft@v0
      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the Docker image for both platforms and publishes it to
  # ghcr.io (the only registry this project publishes to — see the
  # Phase 5 plan) using the built-in GITHUB_TOKEN, no extra secrets
  # needed. build/docker/release.sh does the actual build+push; PUSH=1
  # is what switches it from its default build-only-and-verify mode.
  docker:
    name: docker build (amd64 + arm64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push
        run: sh build/docker/release.sh "${{ github.ref_name }}"
        env:
          PUSH: "1"
